# Format example only. Replace every performance and memory value with measurements
# from the exact runtime flags, model precision, prompt length, and device frequency.
version: 2

objective:
  prompt_tokens: 512
  output_tokens: 128
  dtype_bytes: 2
  kv_context_tokens: 1024
  ttft_weight: 0.6
  tpot_weight: 0.4
  # 0 uses only means; 1 uses the conservative all-P95/P05 scenario.
  risk_weight: 0.25
  energy_weight: 0.0
  remote_device_penalty: 0.0
  # Keep 1 for normal subset selection. Set 4 only for the no-subset ablation.
  min_devices: 1
  # This is an upper bound, not a required device count. Omit it to allow all devices.
  max_devices: 4

devices:
  - name: rk-master
    role: master
    description: RK3588 API/vision/master node
    enabled: true
    usable_memory_mb: 6200
    # Include vision model, embedding, lm_head, runtime, and safety reserve.
    fixed_memory_mb: 1800
    layer_memory_mb: 220
    prefill_ms: 45.0
    decode_ms: 24.0
    prefill_p95_ms: 55.0
    decode_p95_ms: 31.0
    prefill_energy_mj: 0.0
    decode_energy_mj: 0.0

  - name: rk-worker1
    role: worker
    host: "192.168.1.81:10128"
    description: RK3588 worker 1
    enabled: true
    usable_memory_mb: 6500
    fixed_memory_mb: 700
    layer_memory_mb: 220
    prefill_ms: 42.0
    decode_ms: 22.0
    prefill_p95_ms: 57.0
    decode_p95_ms: 31.0
    prefill_energy_mj: 0.0
    decode_energy_mj: 0.0
    rtt_ms: 0.8
    rtt_p95_ms: 1.4
    bandwidth_mbps: 940
    bandwidth_p05_mbps: 820
    protocol_ms: 0.15
    protocol_p95_ms: 0.24

  - name: rk-worker2
